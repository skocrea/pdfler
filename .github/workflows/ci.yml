name: CI

on:
  push:
    branches: [main, "claude/**"]
  pull_request:
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Swift-Version
        run: swift --version
      - name: Build
        run: swift build
      - name: Tests
        run: swift test
      - name: App-Bundle bauen (Universal)
        run: UNIVERSAL=1 scripts/build-app.sh
      - name: Zippen
        run: ditto -c -k --keepParent "dist/PDFler.app" dist/PDFler.zip
      - uses: actions/upload-artifact@v4
        with:
          name: PDFler
          path: dist/PDFler.zip
